<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Steinheim">
  <!--
    Tab-sized mark. The app icon's two hairlines vanish at 16px, so this variant
    keeps the same double-wave gesture with strokes heavy enough to survive the
    downscale, and drops the porcelain wave to a single champagne one plus a
    lighter echo — two competing lights at this size just read as mud.
  -->
  <rect width="32" height="32" rx="7" fill="#080808" />
  <g fill="none" stroke-linecap="round">
    <path d="M6.5 13.2 C 10 10.6, 13.5 10.6, 16 12.3 S 22 15.8, 25.5 13" stroke="#F7F5F0" stroke-width="2.6" />
    <path d="M6.5 20.4 C 10 17.8, 13.5 17.8, 16 19.5 S 22 23, 25.5 20.2" stroke="#B7A27A" stroke-width="2.2" />
  </g>
</svg>
