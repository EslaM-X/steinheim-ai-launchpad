# Steinheim — self-hosted application + automation plane.
#
# Local:
#   docker compose --env-file .env -f docker-compose.yml up -d --build
#
# Architecture:
#   app         -> Steinheim Node server :3000
#   n8n         -> automation            :5678
#   n8n-db      -> PostgreSQL for n8n
#   cloudflared -> optional public HTTPS tunnel
#
# IMPORTANT:
# VITE_* variables are passed both:
#   1. as Docker build arguments, because Vite needs them during npm run build
#   2. as runtime environment variables, because the application also reads them
#
# n8n reaches the application internally at:
#   http://app:3000
#
# cloudflared is optional and only starts with:
#   docker compose --profile tunnel up -d

services:
  # ============================================================
  # Steinheim application
  # ============================================================
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}

    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      # --------------------------------------------------------
      # Public/client-side Supabase configuration
      # --------------------------------------------------------
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}

      # --------------------------------------------------------
      # Server-side Supabase configuration
      # --------------------------------------------------------
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}

      # --------------------------------------------------------
      # AI
      # --------------------------------------------------------
      AI_BASE_URL: ${AI_BASE_URL}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL}
      AI_MODEL_FALLBACKS: ${AI_MODEL_FALLBACKS:-}
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}

      # --------------------------------------------------------
      # Automation / security
      # --------------------------------------------------------
      AUTOMATION_SECRET: ${AUTOMATION_SECRET}
      CREATIVE_WORKER_SECRET: ${CREATIVE_WORKER_SECRET}

      # --------------------------------------------------------
      # Telegram
      # --------------------------------------------------------
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}

      # --------------------------------------------------------
      # Creative generation
      # --------------------------------------------------------
      CREATIVE_MODE: ${CREATIVE_MODE:-mock}

      # --------------------------------------------------------
      # Application URLs
      #
      # Local default:
      #   http://localhost:3000
      #
      # Later, when Cloudflare Tunnel is configured:
      #   APP_URL=https://your-subdomain.your-domain.com
      #   WORKER_URL=https://your-subdomain.your-domain.com
      # --------------------------------------------------------
      WORKER_URL: ${WORKER_URL:-http://localhost:3000}
      APP_URL: ${APP_URL:-http://localhost:3000}

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/auth').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ============================================================
  # PostgreSQL database for n8n
  # ============================================================
  n8n-db:
    image: postgres:16-alpine

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${N8N_DB_USER:-n8n}
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
      POSTGRES_DB: ${N8N_DB_NAME:-n8n}

    volumes:
      - n8n_db:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${N8N_DB_USER:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ============================================================
  # n8n automation engine
  # ============================================================
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest

    restart: unless-stopped

    depends_on:
      n8n-db:
        condition: service_healthy

      app:
        condition: service_healthy

    ports:
      - "5678:5678"

    environment:
      # --------------------------------------------------------
      # Database
      # --------------------------------------------------------
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}

      # --------------------------------------------------------
      # n8n encryption
      # --------------------------------------------------------
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

      # --------------------------------------------------------
      # Time
      # --------------------------------------------------------
      GENERIC_TIMEZONE: Africa/Cairo
      TZ: Africa/Cairo

      # --------------------------------------------------------
      # Privacy / execution behavior
      # --------------------------------------------------------
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"

      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"

    volumes:
      - n8n_data:/home/node/.n8n

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ============================================================
  # Cloudflare Tunnel
  #
  # OPTIONAL.
  #
  # It does NOT run by default.
  #
  # After configuring TUNNEL_TOKEN in .env:
  #
  #   docker compose \
  #     --env-file .env \
  #     --profile tunnel \
  #     up -d
  #
  # The tunnel connects OUTBOUND to Cloudflare.
  # No inbound port forwarding is required.
  #
  # IMPORTANT:
  # Do not use the company's live shop domain as the application
  # hostname. Use a dedicated subdomain.
  # ============================================================
  cloudflared:
    image: cloudflare/cloudflared:latest

    restart: unless-stopped

    profiles:
      - tunnel

    depends_on:
      app:
        condition: service_healthy

    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${TUNNEL_TOKEN}

# ================================================================
# Persistent Docker volumes
#
# docker compose down
#     -> keeps these volumes
#
# docker compose down -v
#     -> DELETES the volumes
#
# Therefore do NOT use "down -v" unless you intentionally want
# to delete n8n's database and n8n's stored credentials/workflows.
  # ============================================================
  # Webhook watchdog
  # ============================================================
  #
  # Keeps the Telegram webhook pointing at an address that answers.
  #
  # A quick tunnel is issued per run and can drop while its container keeps
  # running. Telegram then holds a URL returning 530 and every message is lost
  # in silence: the bot looks broken, the stack looks healthy, and neither says
  # why. Observed exactly that, which is why this exists.
  #
  # The Docker socket is mounted read-only and used for one thing: reading the
  # tunnel container's log, which is where a quick tunnel announces its
  # hostname. Set PUBLIC_URL to a named tunnel and no discovery is needed.
  webhook-watchdog:
    image: docker:27-cli
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      PUBLIC_URL: ${PUBLIC_URL:-}
      WATCHDOG_INTERVAL: ${WATCHDOG_INTERVAL:-120}
      TUNNEL_CONTAINER: ${TUNNEL_CONTAINER:-steinheim-quick-tunnel}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./webhook-watchdog.sh:/watchdog.sh:ro
    entrypoint: ["sh", "/watchdog.sh"]

# ================================================================
volumes:
  n8n_db:
  n8n_data:
