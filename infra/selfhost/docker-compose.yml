# Steinheim, self-hosted: the application and its automation plane on one box.
#
#   cp .env.selfhost.example .env && docker compose up -d --build
#
# n8n reaches the app at http://app:3000 over the internal network, so the
# automation secret never crosses the public internet on this hop.

services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      AI_BASE_URL: ${AI_BASE_URL}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL}
      AUTOMATION_SECRET: ${AUTOMATION_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      CREATIVE_MODE: ${CREATIVE_MODE:-mock}
      CREATIVE_WORKER_SECRET: ${CREATIVE_WORKER_SECRET}
      # Where long work runs. Same process when everything is on this box; set
      # to this box's address when the front end is hosted elsewhere, so a
      # request ceiling over there can never cut a sync short.
      WORKER_URL: ${WORKER_URL:-http://localhost:3000}
      APP_URL: ${APP_URL:-http://localhost:3000}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/auth').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  n8n-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${N8N_DB_USER:-n8n}
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
      POSTGRES_DB: ${N8N_DB_NAME:-n8n}
    volumes:
      - n8n_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${N8N_DB_USER:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      n8n-db:
        condition: service_healthy
      app:
        condition: service_started
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: Africa/Cairo
      TZ: Africa/Cairo
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Publishes the app without opening a single inbound port: cloudflared dials
  # out to Cloudflare and traffic arrives back down that connection. The server
  # can keep its firewall closed.
  #
  # Optional — the stack runs without it. Start it with:
  #   docker compose --profile tunnel up -d
  # after putting a named-tunnel token in TUNNEL_TOKEN. Use a hostname that is
  # NOT the company website: steinheim-eg.com is the live shop and the
  # catalogue this system reads as its source of truth.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    depends_on:
      app:
        condition: service_healthy
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}

volumes:
  # Named volumes, so n8n's workflows and credentials and Postgres' data
  # outlive `docker compose down`. Only `down -v` removes them.
  n8n_db:
  n8n_data:
