version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      # Monthly, not weekly: bumps arrive as a short list instead of a
      # permanent PR pile-up on a repo with a single maintainer.
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)
