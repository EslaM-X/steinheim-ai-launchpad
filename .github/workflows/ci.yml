name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the Dockerfile (node:24-alpine): several deps declare
          # engines >=22, so CI must run the same runtime as production.
          node-version: 24
      # `npm ci` installs the committed lockfile exactly. `npm install` floats
      # transitive versions, which is how a TanStack core got split into two
      # chunks that imported each other and crashed every request in production.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # Fails when a layer changed without its mirrors following: a workflow
      # calling a route that no longer exists, an endpoint nothing consumes,
      # stale generated docs, compose variables missing from the example env.
      - run: npm run sync:check
